<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient (Eye Comfort: Deep Obsidian Slate #090D15 to #0D131F) -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0c111c" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Shelf Wood Gradient (Warm Aged Teak #3A2B1D) -->
    <linearGradient id="shelfWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d2014" />
      <stop offset="50%" stop-color="#423020" />
      <stop offset="100%" stop-color="#261b11" />
    </linearGradient>

    <!-- Warm Amber Glow (585nm low eye-strain wavelength) -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Card Background -->
    <linearGradient id="artBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1522" />
      <stop offset="100%" stop-color="#080e18" />
    </linearGradient>

    <!-- Filter for subtle warm neon -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- ==================== OUTER TERMINAL WINDOW ==================== -->
  <rect x="2" y="2" width="916" height="276" rx="12" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Terminal Title Bar -->
  <rect x="2" y="2" width="916" height="34" rx="12" fill="#0f172a" />
  <rect x="2" y="24" width="916" height="12" fill="#0f172a" />
  <line x1="2" y1="36" x2="918" y2="36" stroke="#1e293b" stroke-width="1" />

  <!-- Window Action Buttons (Red, Amber, Emerald) -->
  <circle cx="20" cy="19" r="5" fill="#ef4444" />
  <circle cx="36" cy="19" r="5" fill="#f59e0b" />
  <circle cx="52" cy="19" r="5" fill="#10b981" />

  <!-- Window Title -->
  <text x="460" y="23" text-anchor="middle" fill="#64748b" font-size="11.5" class="mono" font-weight="500">
    hans-cdm@study-desk: ~ (pwsh/bookshelf) — WINDOWS 11 WORKSTATION
  </text>

  <!-- ==================== LEFT: PIXEL BOOKSHELF ART ==================== -->
  <g transform="translate(24, 52)">
    <!-- Art Box Frame -->
    <rect x="0" y="0" width="180" height="206" rx="8" fill="url(#artBg)" stroke="#1e293b" stroke-width="1.2" />

    <!-- Ambient Lamp Radiance -->
    <circle cx="90" cy="80" r="70" fill="url(#lampGlow)" />

    <!-- Study Lamp on Top of Shelf -->
    <g transform="translate(112, 18)">
      <!-- Lamp Head & Bulb -->
      <path d="M 0 24 L 14 6 L 24 6 L 28 24 Z" fill="#334155" stroke="#475569" stroke-width="1.2" />
      <circle cx="14" cy="20" r="3.5" fill="#fbbf24" filter="url(#softGlow)" />
      <!-- Lamp Arm & Stand -->
      <path d="M 19 6 L 26 -4 L 32 4" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <!-- Light Cone (Soft Amber) -->
      <polygon points="2,24 26,24 45,70 -15,70" fill="#fef08a" opacity="0.07" />
    </g>

    <!-- Top Shelf Plank (Teak Wood) -->
    <rect x="14" y="90" width="152" height="6" rx="1.5" fill="url(#shelfWood)" />
    <!-- Shelf shadow -->
    <rect x="16" y="96" width="148" height="2" fill="#000000" opacity="0.4" />

    <!-- Top Shelf Items: Plant & Leaning Books -->
    <!-- Small Plant -->
    <polygon points="30,90 44,90 41,78 33,78" fill="#b91c1c" />
    <ellipse cx="37" cy="78" rx="4.5" ry="1.5" fill="#451a03" />
    <path d="M 37 78 Q 32 68 28 71 Q 35 74 37 78" fill="#10b981" />
    <path d="M 37 78 Q 38 64 43 67 Q 39 73 37 78" fill="#059669" />
    <path d="M 37 78 Q 37 62 35 60 Q 39 70 37 78" fill="#34d399" />

    <!-- Books on Top Shelf -->
    <rect x="58" y="46" width="10" height="44" rx="1" fill="#38bdf8" />
    <rect x="70" y="40" width="11" height="50" rx="1" fill="#f59e0b" />
    <rect x="83" y="48" width="8" height="42" rx="1" fill="#10b981" />
    <!-- Leaning Book -->
    <g transform="translate(100, 90) rotate(16) translate(-7, -42)">
      <rect x="0" y="0" width="10" height="42" rx="1" fill="#a855f7" />
    </g>

    <!-- Bottom Shelf Plank (Teak Wood) -->
    <rect x="14" y="158" width="152" height="6" rx="1.5" fill="url(#shelfWood)" />
    <rect x="16" y="164" width="148" height="2" fill="#000000" opacity="0.4" />

    <!-- Bottom Shelf Books (Tech volumes with Spine text) -->
    <!-- JS Book (Gold) -->
    <rect x="26" y="108" width="14" height="50" rx="1.2" fill="#eab308" />
    <text x="33" y="136" font-size="7.5" fill="#422006" font-weight="bold" class="mono" text-anchor="middle" transform="rotate(-90 33 136)">JS</text>

    <!-- PHP Book (Indigo) -->
    <rect x="42" y="112" width="15" height="46" rx="1.2" fill="#6366f1" />
    <text x="49.5" y="138" font-size="7.5" fill="#ffffff" font-weight="bold" class="mono" text-anchor="middle" transform="rotate(-90 49.5 138)">PHP</text>

    <!-- TS Book (Sky Blue) -->
    <rect x="59" y="106" width="13" height="52" rx="1.2" fill="#0284c7" />
    <text x="65.5" y="135" font-size="7.5" fill="#ffffff" font-weight="bold" class="mono" text-anchor="middle" transform="rotate(-90 65.5 135)">TS</text>

    <!-- BOT Book (Teal) -->
    <rect x="74" y="114" width="14" height="44" rx="1.2" fill="#0d9488" />
    <text x="81" y="139" font-size="7" fill="#ffffff" font-weight="bold" class="mono" text-anchor="middle" transform="rotate(-90 81 139)">BOT</text>

    <!-- APP Book (Purple, leaning) -->
    <g transform="translate(98, 158) rotate(14) translate(-7, -46)">
      <rect x="0" y="0" width="14" height="46" rx="1.2" fill="#9333ea" />
      <text x="7" y="26" font-size="7" fill="#ffffff" font-weight="bold" class="mono" text-anchor="middle" transform="rotate(-90 7 26)">APP</text>
    </g>

    <!-- Stone Bookend -->
    <rect x="135" y="130" width="20" height="28" rx="2" fill="#334155" stroke="#475569" stroke-width="1" />

    <!-- Shelf Side Pillars -->
    <rect x="14" y="90" width="4" height="74" fill="#20160d" />
    <rect x="162" y="90" width="4" height="74" fill="#20160d" />

    <!-- Card Footer Label -->
    <text x="90" y="190" text-anchor="middle" fill="#64748b" font-size="8.5" class="mono" letter-spacing="1">
      &amp; LIVING GIT-BOOKSHELF
    </text>
  </g>

  <!-- ==================== RIGHT: MAIN TERMINAL INTERFACE ==================== -->
  <g transform="translate(224, 52)">
    <!-- Terminal Command Line -->
    <g class="mono" font-size="12">
      <text x="0" y="18" fill="#10b981">📚 hans-cdm@study-desk:~$</text>
      <text x="210" y="18" fill="#38bdf8">tree /sys/library/manifest --growth</text>
      <rect x="500" y="7" width="7.5" height="13" fill="#38bdf8" class="cursor" />
    </g>

    <!-- Main Developer Identity -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" font-size="32" font-weight="800" fill="#f8fafc" class="mono" letter-spacing="1">hans-cdm</text>
      
      <!-- Online Badge Pill -->
      <g transform="translate(190, -22)">
        <rect x="0" y="0" width="125" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="1" />
        <circle cx="12" cy="11" r="3.5" fill="#34d399" filter="url(#softGlow)" />
        <text x="23" y="15" font-size="10" font-weight="700" fill="#6ee7b7" class="mono">ONLINE // zen</text>
      </g>
    </g>

    <!-- Developer Roles / Tagline -->
    <text x="0" y="86" font-size="12.5" fill="#94a3b8" class="sans">
      Digital Bookshelf Architect <tspan fill="#475569">|</tspan> Web &amp; Automation <tspan fill="#475569">|</tspan> Systems Explorer <tspan fill="#475569">|</tspan> Growth Matrix
    </text>

    <!-- Tech Stack Pill Buttons (Aesthetic Dark Academia / Terminal) -->
    <g transform="translate(0, 108)" class="mono" font-size="10.5">
      <!-- Windows 11 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="102" height="24" rx="5" fill="#0f172a" stroke="#334155" />
        <circle cx="10" cy="12" r="3" fill="#38bdf8" />
        <text x="18" y="16" fill="#cbd5e1">Windows 11</text>
      </g>
      <!-- Ryzen 5 -->
      <g transform="translate(110, 0)">
        <rect x="0" y="0" width="105" height="24" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="16" fill="#f59e0b">Ryzen 5 6600H</text>
      </g>
      <!-- PowerShell -->
      <g transform="translate(223, 0)">
        <rect x="0" y="0" width="94" height="24" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="16" fill="#38bdf8">PowerShell</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(325, 0)">
        <rect x="0" y="0" width="88" height="24" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="16" fill="#facc15">JavaScript</text>
      </g>
      <!-- PHP -->
      <g transform="translate(421, 0)">
        <rect x="0" y="0" width="58" height="24" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="16" fill="#818cf8">PHP</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(487, 0)">
        <rect x="0" y="0" width="92" height="24" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="16" fill="#38bdf8">TypeScript</text>
      </g>
      <!-- Git Core -->
      <g transform="translate(587, 0)">
        <rect x="0" y="0" width="75" height="24" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="16" fill="#f97316">Git Core</text>
      </g>
    </g>

    <!-- Bottom Specs Status Line Box -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="665" height="28" rx="6" fill="#080d16" stroke="#1e293b" />
      <g class="mono" font-size="10.5" fill="#64748b" transform="translate(14, 18)">
        <text x="0" y="0"><tspan fill="#475569">OS:</tspan> Win 11 Home (x64)</text>
        <text x="175" y="0"><tspan fill="#475569">RAM:</tspan> 16 GB DDR5</text>
        <text x="315" y="0"><tspan fill="#475569">SPEC:</tspan> <tspan fill="#a855f7">Masa Eksplorasi 🌱</tspan></text>
        <text x="510" y="0"><tspan fill="#475569">STATUS:</tspan> <tspan fill="#10b981">Growth Active</tspan></text>
      </g>
    </g>
  </g>
</svg>
