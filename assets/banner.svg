<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Shelf Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b2d1d" />
      <stop offset="50%" stop-color="#4a3724" />
      <stop offset="100%" stop-color="#2c2115" />
    </linearGradient>

    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-blink { animation: blink 1s infinite; }
    .amber-pulse { animation: pulse 3s infinite ease-in-out; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="876" height="226" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Grid Dots -->
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3" />
  </pattern>
  <rect x="2" y="2" width="876" height="226" rx="14" fill="url(#grid)" />

  <!-- Ambient Lamp Glow -->
  <circle cx="130" cy="45" r="45" fill="url(#glowAmber)" />

  <!-- ==================== BOOKSHELF ILLUSTRATION (LEFT) ==================== -->
  <g transform="translate(45, 25)">
    <!-- Small Desk Lamp -->
    <path d="M 60 55 L 75 25 L 85 25 L 90 55 Z" fill="#475569" stroke="#64748b" stroke-width="1.5" />
    <path d="M 80 25 L 95 12" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <circle cx="75" cy="50" r="4" fill="#fbbf24" filter="url(#neonGlow)" />
    <!-- Lamp Light Beam -->
    <polygon points="65,55 85,55 115,100 35,100" fill="#fef08a" opacity="0.08" />

    <!-- Top Shelf Shelf Plank -->
    <rect x="15" y="95" width="200" height="7" rx="2" fill="url(#woodGrad)" stroke="#1c140d" stroke-width="1" />
    <rect x="20" y="102" width="190" height="3" fill="#1c1917" opacity="0.6" />

    <!-- Top Shelf Items (Small succulent plant & books) -->
    <!-- Plant pot -->
    <polygon points="175,95 195,95 190,80 180,80" fill="#dc2626" />
    <ellipse cx="185" cy="80" rx="6" ry="2" fill="#78350f" />
    <!-- Plant leaves -->
    <path d="M 185 80 Q 180 70 176 72 Q 183 75 185 80" fill="#10b981" />
    <path d="M 185 80 Q 187 66 193 68 Q 188 74 185 80" fill="#059669" />
    <path d="M 185 80 Q 185 64 183 62 Q 187 72 185 80" fill="#34d399" />

    <!-- Top Books (leaning) -->
    <rect x="35" y="48" width="12" height="47" rx="1.5" fill="#3b82f6" />
    <line x1="41" y1="52" x2="41" y2="90" stroke="#60a5fa" stroke-width="1" />

    <rect x="49" y="44" width="13" height="51" rx="1.5" fill="#f59e0b" />
    <line x1="55" y1="48" x2="55" y2="90" stroke="#fcd34d" stroke-width="1" />

    <rect x="64" y="52" width="10" height="43" rx="1.5" fill="#10b981" />
    <line x1="69" y1="56" x2="69" y2="90" stroke="#6ee7b7" stroke-width="1" />

    <!-- Leaning Book -->
    <g transform="translate(85, 95) rotate(18) translate(-10, -48)">
      <rect x="0" y="0" width="12" height="48" rx="1.5" fill="#ec4899" />
      <line x1="6" y1="5" x2="6" y2="43" stroke="#f472b6" stroke-width="1" />
    </g>

    <!-- Bottom Shelf Shelf Plank -->
    <rect x="15" y="165" width="200" height="7" rx="2" fill="url(#woodGrad)" stroke="#1c140d" stroke-width="1" />
    <rect x="20" y="172" width="190" height="3" fill="#1c1917" opacity="0.6" />

    <!-- Bottom Shelf Books (Tech stack spines) -->
    <!-- JS Book -->
    <rect x="30" y="112" width="16" height="53" rx="1.5" fill="#eab308" />
    <text x="38" y="142" font-size="8" fill="#422006" font-weight="bold" class="mono" text-anchor="middle" transform="rotate(-90 38 142)">JS</text>

    <!-- PHP Book -->
    <rect x="48" y="116" width="18" height="49" rx="1.5" fill="#6366f1" />
    <text x="57" y="143" font-size="8" fill="#ffffff" font-weight="bold" class="mono" text-anchor="middle" transform="rotate(-90 57 143)">PHP</text>

    <!-- TS Book -->
    <rect x="68" y="110" width="15" height="55" rx="1.5" fill="#0284c7" />
    <text x="75" y="141" font-size="8" fill="#ffffff" font-weight="bold" class="mono" text-anchor="middle" transform="rotate(-90 75 141)">TS</text>

    <!-- BOT Book -->
    <rect x="85" y="119" width="17" height="46" rx="1.5" fill="#14b8a6" />
    <text x="93" y="144" font-size="8" fill="#ffffff" font-weight="bold" class="mono" text-anchor="middle" transform="rotate(-90 93 144)">BOT</text>

    <!-- APP Book (leaning) -->
    <g transform="translate(112, 165) rotate(15) translate(-8, -48)">
      <rect x="0" y="0" width="16" height="48" rx="1.5" fill="#8b5cf6" />
      <text x="8" y="26" font-size="8" fill="#ffffff" font-weight="bold" class="mono" text-anchor="middle" transform="rotate(-90 8 26)">APP</text>
    </g>

    <!-- Bookends / decorative rock -->
    <rect x="165" y="135" width="26" height="30" rx="3" fill="#334155" stroke="#475569" stroke-width="1" />
    <line x1="178" y1="139" x2="178" y2="161" stroke="#64748b" stroke-width="1.5" />

    <!-- Shelf Side Pillars -->
    <rect x="15" y="95" width="6" height="77" fill="#2c2115" />
    <rect x="209" y="95" width="6" height="77" fill="#2c2115" />
  </g>

  <!-- ==================== TERMINAL TEXT & INFO (RIGHT) ==================== -->
  <g transform="translate(305, 38)">
    <!-- Top Terminal Breadcrumb -->
    <g class="mono" font-size="12">
      <text x="0" y="12" fill="#64748b">guest@hans-cdm:~$</text>
      <text x="140" y="12" fill="#38bdf8">cat /bookshelf/portfolio.md</text>
      <rect x="365" y="1" width="7" height="13" fill="#38bdf8" class="cursor-blink" />
    </g>

    <!-- Main Name Header -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" font-size="28" font-weight="800" fill="#f8fafc" class="mono" letter-spacing="1">HANS-CDM</text>
      <text x="155" y="-3" font-size="12" font-weight="600" fill="#10b981" class="mono">● ONLINE</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="74" font-size="14" fill="#94a3b8" class="sans" font-weight="400">
      The Digital Bookshelf • Adaptive Developer Workspace &amp; Growth Matrix
    </text>

    <!-- Aesthetic Pill Badges -->
    <g transform="translate(0, 96)" class="mono" font-size="11">
      <!-- Badge 1: System -->
      <rect x="0" y="0" width="150" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="12" y="16" fill="#38bdf8">💻 Win11 • Ryzen 5</text>

      <!-- Badge 2: Growth Status -->
      <rect x="160" y="0" width="175" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="172" y="16" fill="#f59e0b">🌱 Growth: Real-Time</text>

      <!-- Badge 3: Specialization -->
      <rect x="345" y="0" width="180" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="357" y="16" fill="#a855f7">🎯 Spec: In Progress</text>
    </g>

    <!-- Quote / Philosophy -->
    <text x="0" y="146" font-size="11.5" fill="#64748b" class="mono" font-style="italic">
      "Every project is a new volume on the shelf, growing with every commit."
    </text>
  </g>
</svg>
